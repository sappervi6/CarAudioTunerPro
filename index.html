<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Ultimate car audio tuning calculator and signal generator." />
    
    <title>AudioTuner Pro</title>
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              neon: {
                blue: 'var(--color-primary)',
                pink: 'var(--color-secondary)',
                green: 'var(--color-tertiary)'
              },
              dark: {
                bg: 'var(--color-bg)',
                card: 'var(--color-card)',
                surface: 'var(--color-surface)'
              },
              // Map standard colors to variables for Day/Night switching
              white: 'var(--color-text-main)',
              black: 'var(--color-text-inverse)',
              gray: {
                300: 'var(--color-text-muted)',
                400: 'var(--color-text-dim)',
                500: 'var(--color-text-dimmer)',
                600: 'var(--color-border)',
                700: 'var(--color-border-dim)',
                800: 'var(--color-border-dark)',
                900: 'var(--color-surface-dark)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Night Mode (Cyberpunk) */
        --color-bg: #0f1115;
        --color-card: #161b22;
        --color-surface: #21262d;
        --color-surface-dark: #0d1117;
        
        --color-primary: #00f3ff;
        --color-secondary: #bc13fe;
        --color-tertiary: #0aff0a;
        
        --color-text-main: #ffffff;
        --color-text-inverse: #000000;
        --color-text-muted: #d1d5db;   /* gray-300 */
        --color-text-dim: #9ca3af;     /* gray-400 */
        --color-text-dimmer: #6b7280;  /* gray-500 */
        
        --color-border: #4b5563;       /* gray-600 */
        --color-border-dim: #374151;   /* gray-700 */
        --color-border-dark: #1f2937;  /* gray-800 */
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text-main);
        overscroll-behavior: none; 
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Smooth transitions for theme changes */
      div, button, input, select, header, footer {
        transition-property: background-color, border-color, color;
        transition-duration: 0.3s;
        transition-timing-function: ease;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-surface);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-border);
      }
      .visualizer-canvas {
        width: 100%;
        height: 120px;
        background: rgba(0,0,0,0.2);
        border-radius: 0.5rem;
      }
      .prose h3 {
        color: var(--color-text-main);
        font-weight: 700;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
      }
      .prose ul {
        list-style-type: disc;
        padding-left: 1.5em;
        color: var(--color-text-muted);
      }
      .prose li {
        margin-bottom: 0.25em;
      }
      .prose strong {
        color: var(--color-primary);
      }
      .prose table {
        width: 100%;
        margin-top: 1em;
        margin-bottom: 1em;
        border-collapse: collapse;
      }
      .prose th {
        text-align: left;
        padding: 8px;
        background: var(--color-surface);
        color: var(--color-primary);
        border: 1px solid var(--color-border);
      }
      .prose td {
        padding: 8px;
        border: 1px solid var(--color-border);
        color: var(--color-text-muted);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
